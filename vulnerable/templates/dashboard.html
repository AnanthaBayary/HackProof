<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - HackProof</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Welcome, {{ username | safe }}</h1>
        <div class="alert alert-warning">💰 Balance: ${{ balance }}</div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <h3>Transfer Money</h3>
                <form method="POST" action="/transfer">
                    <div class="mb-3">
                        <input type="text" name="to_account" class="form-control" placeholder="Recipient Username">
                    </div>
                    <div class="mb-3">
                        <input type="number" name="amount" class="form-control" placeholder="Amount (try negative numbers!)">
                    </div>
                    <button type="submit" class="btn btn-warning">Transfer</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <h3>Search</h3>
                <form method="GET" action="/search">
                    <div class="mb-3">
                        <input type="text" name="q" class="form-control" placeholder="Search...">
                    </div>
                    <button type="submit" class="btn btn-info">Search</button>
                </form>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>
</body>
</html>
